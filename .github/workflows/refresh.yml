name: refresh
# Public repo: standard runners are free. Cron is best-effort and can lag 10-30 minutes.
on:
  schedule:
    - cron: '15 */6 * * *'   # GB
    - cron: '45 6 * * *'     # AU-WA after tomorrow's prices (about 14:45 AWST)
    - cron: '20 11 * * *'    # AU-WA evening (about 19:20 AWST)
    - cron: '20 22 * * *'    # TH morning (05:20 ICT)
    - cron: '0 11 * * *'     # TH evening (18:00 ICT)
  workflow_dispatch:
concurrency: { group: refresh, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests
        run: npm test
      - name: Collect, validate, build dist
        id: build
        run: |
          set -o pipefail
          node run.mjs | tee run.log
          echo "digest=$(grep '^digest' run.log | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Skip deploy when nothing changed
        id: changed
        run: |
          if [ "$(cat data/.digest 2>/dev/null)" = "${{ steps.build.outputs.digest }}" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to the data-only Pages project
        if: steps.changed.outputs.same != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p site/fuel/v1
          cp -r dist/. site/fuel/v1/
          cp public/_headers site/_headers
          npx --yes wrangler@3 pages deploy site --project-name=rdlabs-data --branch=main --commit-dirty=true
      - name: Commit last good data
        run: |
          echo "${{ steps.build.outputs.digest }}" > data/.digest
          git config user.name "fuel-prices-bot" && git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "data: refresh" && git push) || true
